<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <title>TrendHub</title>
</head>

<body>

  <header>
    <nav class="navbar">
      <a class="navbar-brand" href="index.html">TrendHub</a>
      <button class="toggler">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="nav-content">
        <ul class="nav-items">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="shop.html" class="nav-link">Shop</a></li>
          <li><a href="contact.html" class="nav-link" id="active">Contact</a></li>
        </ul>
        <input type="search" name="search" id="search" class="search" placeholder="Search for products">
      </div>

      <div class="icons">
        <a href="cart.html" aria-label="Cart"><i class="fa-solid fa-bag-shopping"></i><span class="cart-count"></span></a>
      </div>
    </nav>
  </header>

  <main>
    <section class="contact-container">
      <div class="contact-us">
        <h2>Contact Us</h2>
        <form id="form">
          <input type="text" id="name" placeholder="Name">
          <input type="tel" id="phone" placeholder="Phone">
          <textarea id="message" placeholder="Message" rows="5"></textarea>
          <button type="submit" class="btn">Submit</button>
          <div id="error"></div>
        </form>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>

</html>
